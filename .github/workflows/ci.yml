name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, contracts and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Audit dependency vulnerabilities
        run: corepack pnpm audit

      - name: Verify migration history is current
        shell: bash
        env:
          CATALOG_MIGRATION_DATABASE_URL: postgresql://contract:contract@127.0.0.1:9/medicos_contract
        run: |
          corepack pnpm db:generate:catalog
          if [[ -n "$(git status --porcelain -- drizzle/catalog/migrations)" ]]; then
            git status --short -- drizzle/catalog/migrations
            exit 1
          fi

      - name: Run quality gate
        run: corepack pnpm quality

      - name: Enforce coverage thresholds
        run: corepack pnpm test:coverage

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run Testcontainers suite
        run: corepack pnpm test:integration
